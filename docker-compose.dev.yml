services:
  api:
    build:
      context: .
      target: builder
    container_name: api_deputados_dev
    # Comando para Debian (não precisa de sh -c se for simples, mas mantemos para garantir a ordem)
    command: sh -c "npx prisma generate && npm run start:dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env.dev
    environment:
      - TZ=America/Sao_Paulo

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # ALTERAÇÃO: Adicionado volume nomeado para manter o histórico de métricas do Prometheus
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    # ALTERAÇÃO: Adicionada a secção de volumes para salvar credenciais e dashboards do Grafana
    volumes:
      - grafana-data:/var/lib/grafana
  
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "9100:9100"

# ALTERAÇÃO: Declaração global dos volumes no final do ficheiro para que o Docker os crie
volumes:
  prometheus-data:
  grafana-data: